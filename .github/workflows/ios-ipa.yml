name: Build Private iOS IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: Xcode export method
        type: choice
        required: true
        default: ad-hoc
        options:
          - ad-hoc
          - development
      build_number:
        description: Optional CFBundleVersion override
        type: string
        required: false

permissions:
  contents: read

env:
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  BUNDLE_ID: com.readori.music
  XCODE_WORKSPACE: ios/App/App.xcworkspace
  XCODE_SCHEME: App
  ARCHIVE_PATH: ${{ runner.temp }}/ReadoriMusic.xcarchive
  EXPORT_PATH: ${{ runner.temp }}/ipa

jobs:
  build-ipa:
    name: Build signed private IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show build environment
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p
          sw_vers

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets
        run: bun run build

      - name: Sync Capacitor iOS project
        run: bunx cap sync ios

      - name: Patch iOS bundle id and background audio
        run: |
          set -euo pipefail

          PLIST="ios/App/App/Info.plist"

          if [ ! -f "$PLIST" ]; then
            echo "Info.plist not found at $PLIST"
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $BUNDLE_ID" "$PLIST"

          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" >/dev/null 2>&1 || \
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"

          if ! /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" | grep -q "audio"; then
            UI_BACKGROUND_INDEX=$( /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" 2>/dev/null | grep -E '^[[:space:]]*[0-9]+:' | tail -n1 | sed -E 's/^[[:space:]]*([0-9]+):.*$/\1/' )
            if [ -z "$UI_BACKGROUND_INDEX" ]; then
              UI_BACKGROUND_INDEX=0
            else
              UI_BACKGROUND_INDEX=$((UI_BACKGROUND_INDEX + 1))
            fi
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:$UI_BACKGROUND_INDEX string audio" "$PLIST"
          fi

          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"

      - name: Install CocoaPods
        run: |
          set -euo pipefail
          cd ios/App
          pod install

      - name: Resolve Xcode export method
        run: |
          set -euo pipefail

          REQUESTED_METHOD="${{ inputs.export_method }}"
          XCODE_VERSION=$(xcodebuild -version | awk '/Xcode/{print $2}')
          MAJOR=${XCODE_VERSION%%.*}
          MINOR=0

          if [[ "$XCODE_VERSION" == *.* ]]; then
            MINOR_PART=${XCODE_VERSION#*.}
            MINOR=${MINOR_PART%%.*}
          fi

          RESOLVED_METHOD="$REQUESTED_METHOD"

          if [ "${MAJOR:-0}" -gt 15 ] || { [ "${MAJOR:-0}" -eq 15 ] && [ "${MINOR:-0}" -ge 4 ]; }; then
            case "$REQUESTED_METHOD" in
              ad-hoc) RESOLVED_METHOD="release-testing" ;;
              development) RESOLVED_METHOD="debugging" ;;
            esac
          fi

          echo "RESOLVED_EXPORT_METHOD=$RESOLVED_METHOD" >> "$GITHUB_ENV"
          echo "Using export method '$RESOLVED_METHOD' for Xcode $XCODE_VERSION"

      - name: Install signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_TEAM_ID}" ]; then
            echo "Missing APPLE_TEAM_ID secret."
            exit 1
          fi

          if [ -z "${BUILD_CERTIFICATE_BASE64}" ] || [ -z "${P12_PASSWORD}" ] || [ -z "${BUILD_PROVISION_PROFILE_BASE64}" ] || [ -z "${KEYCHAIN_PASSWORD}" ]; then
            echo "Missing signing secrets."
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build_profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/build_profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
          PROFILE_APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PROFILE_PLIST")
          EXPECTED_APP_IDENTIFIER="${APPLE_TEAM_ID}.${BUNDLE_ID}"

          echo "Installed profile name: $PROFILE_NAME"
          echo "Profile application identifier: $PROFILE_APP_IDENTIFIER"
          echo "Expected application identifier: $EXPECTED_APP_IDENTIFIER"

          if [ "$PROFILE_APP_IDENTIFIER" != "$EXPECTED_APP_IDENTIFIER" ]; then
            echo "Provisioning profile does not match APPLE_TEAM_ID + BUNDLE_ID."
            exit 1
          fi

          if ! /usr/libexec/PlistBuddy -c "Print :ProvisionedDevices" "$PROFILE_PLIST" >/dev/null 2>&1; then
            echo "This provisioning profile does not contain ProvisionedDevices."
            exit 1
          fi

          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          {
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "PROFILE_NAME=$PROFILE_NAME"
          } >> "$GITHUB_ENV"

      - name: Apply build number
        if: ${{ inputs.build_number != '' }}
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ inputs.build_number }}" ios/App/App/Info.plist

      - name: Archive app
        run: |
          set -euo pipefail

          xcodebuild archive \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            clean archive

      - name: Create export options
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>compileBitcode</key>
            <false/>
            <key>method</key>
            <string>$RESOLVED_EXPORT_METHOD</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF

          cat "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export IPA
        run: |
          set -euo pipefail

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: readori-music-ios-${{ inputs.export_method }}-ipa
          path: ${{ env.EXPORT_PATH }}/*.ipa
          if-no-files-found: error
          retention-days: 1
